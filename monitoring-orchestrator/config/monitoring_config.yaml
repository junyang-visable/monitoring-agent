version: 1
defaults:
  enabled: true
  timeout_seconds: 60
  timezone: UTC
  # Shared range for Datadog, Stability SDK, and Sentry. Accepted presets:
  # today, yesterday, last_<N>d, or last_<N>h. A project may instead set {start, end} in ISO-8601.
  time_range: last_24h
  tracking_patrol:
    mode: read_latest

# Add one entry per monitored project. Keep secrets in environment variables.
projects:
  search-frontend:
    enabled: true
    app_name: search-frontend
    environment: production
    datadog:
      enabled: true
      # Optional override. Omit when the Datadog service equals app_name.
      service: "visable-dev/search-frontend"
    stability_sdk:
      enabled: false
      output_mode: analysis_only
    sentry:
      enabled: true
      organization: "visable-gmbh"
      project: "search-frontend"
      base_url: "https://us.sentry.io"
      token_env: SENTRY_AUTH_TOKEN
    tracking_patrol:
      enabled: true
      owner: "<configure GitHub owner>"
      repository: "<configure tracking_patrol repository>"
      workflow: "<configure workflow file or id>"
      token_env: GITHUB_TOKEN
