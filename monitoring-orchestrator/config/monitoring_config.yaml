version: 1
defaults:
  enabled: true
  timeout_seconds: 60
  timezone: UTC
  # Shared range for Datadog, Stability SDK, and Sentry. Accepted presets:
  # today, yesterday, previous_week, last_<N>d, or last_<N>h. A manual run may instead use {start, end} in ISO-8601.
  time_range: last_24h

# Shared platform configuration. Project-level blocks override these values.
datadog:
  api:
    base_url: "https://api.datadoghq.com"
    api_key_env: DD_API_KEY
    application_key_env: DD_APPLICATION_KEY
    log_query: "service:{service} status:error"
    error_group_by: "@error.message"
    top_error_limit: 5
    # Fill in the metric names used by all services when available.
    metric_queries:
      error_rate: null
      http_4xx_rate: null
      http_5xx_rate: null
      p95_latency: null

sentry:
  organization: "visable-gmbh"
  base_url: "https://us.sentry.io"
  token_env: SENTRY_AUTH_TOKEN

tracking_patrol:
  owner: "visable-dev"
  repository: "cypress-e2e-framework"
  token_env: GITHUB_TOKEN
  mode: read_latest

# Shared configuration for the single cross-project Stability SDK run.
stability_sdk:
  enabled: true
  output_mode: analysis_only
  # Auto selects hour only for an explicit last_<N>h intent; all natural-day intents use day.
  time_granularity: auto
  # The ETL writes ds/hh after converting source time from GMT+8 to GMT+1.
  partition_timezone: GMT+1
  stability_window_days: 0
  stability_window_hours: 1

# Add one entry per monitored project. Keep secrets in environment variables.
projects:
  search-frontend:
    enabled: true
    app_name: search-frontend
    environment: production
    datadog:
      enabled: true
      # Optional override. Omit when the Datadog service equals app_name.
      service: "visable-dev/search-frontend"
    sentry:
      enabled: true
      project: "search-frontend"
    tracking_patrol:
      enabled: true
      workflow: "team-dolphin-schedule.yml"

  product-editor-frontend:
    enabled: true
    app_name: product-editor-frontend
    environment: production
    # Enable each external signal after confirming its platform resource.
    datadog:
      enabled: true
      service: "visable-dev/product-editor-frontend"
    sentry:
      enabled: true
      project: "product-editor-frontend"
    tracking_patrol:
      enabled: true
      workflow: "team-supplier-analytics-tracking-schedule.yml"
